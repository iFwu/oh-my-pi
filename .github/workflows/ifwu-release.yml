name: iFwu standalone release

on:
   push:
      tags: ["v*-ifwu.*"]

permissions:
   contents: read

concurrency:
   group: ifwu-release-${{ github.ref }}
   cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
   # v18.13.3 uses public Bun, not the patchedBun toolchain of older releases.
   BUN_VERSION: "1.4.4"
   # Keep Rust/native identity upstream even when the CLI version gains -ifwu.N.
   NATIVE_VERSION: "18.13.3"

jobs:
   build:
      if: github.repository == 'iFwu/oh-my-pi'
      runs-on: ubuntu-22.04
      timeout-minutes: 45
      defaults:
         run:
            shell: bash
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
           with:
              persist-credentials: false
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: ${{ env.BUN_VERSION }}
         - name: Check release and native identities
           run: |
              test "$(bun -p 'require("./packages/natives/package.json").version')" = "$NATIVE_VERSION"
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./packages/coding-agent/package.json").version')"
              fi
         - name: Install locked dependencies
           run: bun install --frozen-lockfile
         - name: Download official native addons (no Rust build)
           run: |
              mkdir -p packages/natives/native
              for target in darwin-arm64 linux-x64 win32-x64; do
                dest="$RUNNER_TEMP/native-$target"
                mkdir -p "$dest"
                npm pack "@oh-my-pi/pi-natives-$target@$NATIVE_VERSION" \
                  --registry=https://registry.npmjs.org --ignore-scripts --pack-destination "$dest"
                tar -xzf "$dest"/*.tgz -C "$dest"
                cp "$dest"/package/*.node packages/natives/native/
              done
         - name: Lint and type check
           run: bun run check:ts
         - name: Streamed RetryAfter regression (WebSocket and SSE)
           run: |
              bun test --timeout 120000 \
                ./packages/ai/test/openai-codex-stream.test.ts \
                --test-name-pattern 'streamed retry advice'
         - name: RetryAfter regression tests
           run: |
              bun test --timeout 120000 \
                ./packages/ai/test/error-aierr.test.ts \
                ./packages/ai/test/anthropic-retry.test.ts \
                ./packages/coding-agent/test/agent-session-retry-cap.test.ts
         - name: Markdown regression tests
           run: |
              bun test --timeout 120000 \
                ./packages/utils/test/marked.test.ts \
                ./packages/tui/test/markdown*.test.ts
         - name: Cross-build standalone binaries
           env:
              RELEASE_TARGETS: darwin-arm64,linux-x64,win32-x64
           run: bun run ci:release:build-binaries
         - name: Ad-hoc sign macOS binary with upstream entitlements
           run: bash scripts/ci-macos-sign.sh packages/coding-agent/binaries/omp-darwin-arm64
         - name: Upload signed binaries
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: ifwu-binaries
              path: packages/coding-agent/binaries/omp-*
              if-no-files-found: error

   smoke:
      needs: build
      strategy:
         fail-fast: false
         matrix:
            include:
               - runner: macos-15
                 binary: omp-darwin-arm64
               - runner: ubuntu-22.04
                 binary: omp-linux-x64
               - runner: windows-2022
                 binary: omp-windows-x64.exe
      runs-on: ${{ matrix.runner }}
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
           with:
              persist-credentials: false
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              name: ifwu-binaries
              path: binaries
         - name: Verify macOS signature and entitlements
           if: runner.os == 'macOS'
           shell: bash
           run: |
              test "$(uname -m)" = arm64
              codesign --verify --strict --verbose=2 binaries/omp-darwin-arm64
              codesign -d --entitlements :- binaries/omp-darwin-arm64 > "$RUNNER_TEMP/entitlements.plist"
              python3 - <<'PY'
              import os
              import plistlib
              from pathlib import Path
              expected = plistlib.loads(Path("scripts/macos-entitlements.plist").read_bytes())
              actual = plistlib.loads((Path(os.environ["RUNNER_TEMP"]) / "entitlements.plist").read_bytes())
              assert actual == expected, (actual, expected)
              PY
         - name: Smoke standalone binary (Unix)
           if: runner.os != 'Windows'
           shell: bash
           env:
              BINARY: ${{ matrix.binary }}
           run: |
              binary="$GITHUB_WORKSPACE/binaries/$BINARY"
              chmod +x "$binary"
              runtime_dir="$(mktemp -d "$RUNNER_TEMP/omp-smoke.XXXXXX")"
              export HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg"
              mkdir -p "$HOME" "$XDG_DATA_HOME"
              cd "$runtime_dir"
              "$binary" --version
              "$binary" --smoke-test
         - name: Smoke standalone binary (Windows)
           if: runner.os == 'Windows'
           shell: pwsh
           env:
              BINARY: ${{ matrix.binary }}
           run: |
              $binary = Join-Path $env:GITHUB_WORKSPACE "binaries/$env:BINARY"
              $runtimeDir = Join-Path $env:RUNNER_TEMP "omp-smoke"
              $env:HOME = Join-Path $runtimeDir "home"
              $env:USERPROFILE = $env:HOME
              $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
              Set-Location $runtimeDir
              & $binary --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $binary --smoke-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

   release:
      needs: [build, smoke]
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
           with:
              persist-credentials: false
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: ${{ env.BUN_VERSION }}
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              name: ifwu-binaries
              path: release
         - name: Generate release checksums
           shell: bash
           run: |
              cp LICENSE THIRD-PARTY-NOTICES.txt release/
              bun run ci:release:checksums release/SHA256SUMS.txt \
                release/omp-* release/LICENSE release/THIRD-PARTY-NOTICES.txt
              cd release
              sha256sum -c SHA256SUMS.txt
         - name: Publish fork-only GitHub Release
           env:
              GH_TOKEN: ${{ github.token }}
           shell: bash
           run: |
              gh release create "$GITHUB_REF_NAME" release/* \
                --repo "$GITHUB_REPOSITORY" --verify-tag \
                --title "omp $GITHUB_REF_NAME (iFwu)" \
                --notes 'Standalone iFwu build with RetryAfter and Markdown fixes. Native addons are unchanged upstream 18.13.3 binaries. Verify downloads with SHA256SUMS.txt. macOS is ad-hoc signed with upstream entitlements, not notarized.'
